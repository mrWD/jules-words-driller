<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Select Group Modal</title>
<!-- Fonts -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&amp;family=Noto+Sans:wght@100..900&amp;display=swap" rel="stylesheet"/>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Theme Configuration -->
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#13ec6a",
                        "background-light": "#f6f8f7",
                        "background-dark": "#102217",
                        "surface-dark": "#1a3324", // Slightly lighter than background-dark for cards/inputs
                    },
                    fontFamily: {
                        "display": ["Lexend", "Noto Sans", "sans-serif"]
                    },
                    borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" },
                },
            },
        }
    </script>
<style>
        /* Custom scrollbar for webkit */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .material-symbols-outlined {
            font-variation-settings:
            'FILL' 1,
            'wght' 400,
            'GRAD' 0,
            'opsz' 24
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display h-screen w-full overflow-hidden text-slate-900 dark:text-white antialiased selection:bg-primary selection:text-black">
<!-- Modal Container -->
<div class="relative flex h-full w-full flex-col">
<!-- Header Section -->
<div class="flex flex-col shrink-0 bg-background-light dark:bg-background-dark pt-2 pb-2 z-10">
<!-- Handle -->
<div class="flex w-full items-center justify-center pb-4">
<div class="h-1.5 w-12 rounded-full bg-slate-300 dark:bg-surface-dark/50"></div>
</div>
<!-- Title Bar -->
<div class="flex items-center justify-between px-4 pb-4">
<button class="flex size-10 items-center justify-center rounded-full hover:bg-black/5 dark:hover:bg-white/10 transition-colors">
<span class="material-symbols-outlined text-slate-500 dark:text-slate-400">close</span>
</button>
<h2 class="text-xl font-bold leading-tight tracking-tight flex-1 text-center">Select Group</h2>
<div class="size-10"></div> <!-- Spacer to balance header -->
</div>
<!-- Search Bar -->
<div class="px-4 pb-2">
<div class="flex w-full items-center rounded-xl bg-white dark:bg-surface-dark border border-slate-200 dark:border-white/5 h-12 shadow-sm focus-within:ring-1 focus-within:ring-primary focus-within:border-primary transition-all">
<div class="flex items-center justify-center pl-4 text-slate-400 dark:text-slate-400">
<span class="material-symbols-outlined text-[20px]">search</span>
</div>
<input class="flex w-full flex-1 bg-transparent border-none text-base font-normal placeholder:text-slate-400 dark:placeholder:text-slate-500 text-slate-900 dark:text-white focus:ring-0 px-3 h-full rounded-xl" placeholder="Find a group..." type="text"/>
</div>
</div>
</div>
<!-- Scrollable Tree List -->
<div id="group-list" class="flex-1 overflow-y-auto px-4 py-2 space-y-1">
<!-- Group Item: Verbs (Collapsed) -->
<div class="group flex items-center justify-between p-3 rounded-lg hover:bg-black/5 dark:hover:bg-white/5 transition-colors cursor-pointer">
<div class="flex items-center gap-3 flex-1 overflow-hidden">
<button class="text-slate-400 hover:text-primary dark:text-slate-500 dark:hover:text-white transition-colors">
<span class="material-symbols-outlined text-[20px] rotate-[-90deg]">expand_more</span>
</button>
<div class="flex items-center justify-center rounded-lg bg-emerald-100 dark:bg-surface-dark text-emerald-700 dark:text-emerald-400 shrink-0 size-10">
<span class="material-symbols-outlined text-[22px]">folder</span>
</div>
<div class="flex flex-col">
<p class="text-base font-medium truncate">Verbs</p>
<p class="text-xs text-slate-500 dark:text-slate-400">42 words</p>
</div>
</div>
<div class="shrink-0 pl-2">
<!-- Unchecked State -->
<div class="size-6 rounded-full border-2 border-slate-300 dark:border-slate-600"></div>
</div>
</div>
<!-- Group Item: Travel (Expanded) -->
<div class="group flex items-center justify-between p-3 rounded-lg bg-primary/5 dark:bg-white/[0.02] transition-colors cursor-pointer">
<div class="flex items-center gap-3 flex-1 overflow-hidden">
<button class="text-primary dark:text-primary transition-colors">
<span class="material-symbols-outlined text-[20px]">expand_more</span>
</button>
<div class="flex items-center justify-center rounded-lg bg-primary/20 text-primary dark:text-primary shrink-0 size-10">
<span class="material-symbols-outlined text-[22px]">folder_open</span>
</div>
<div class="flex flex-col">
<p class="text-base font-medium truncate">Travel</p>
<p class="text-xs text-slate-500 dark:text-slate-400">12 words</p>
</div>
</div>
<div class="shrink-0 pl-2">
<div class="size-6 rounded-full border-2 border-slate-300 dark:border-slate-600"></div>
</div>
</div>
<!-- Subgroup Item: Food (Selected) -->
<div class="relative flex items-center justify-between p-3 rounded-lg bg-primary/10 border border-primary/20 cursor-pointer">
<!-- Indentation Guide Line -->
<div class="absolute left-[27px] top-[-20px] bottom-[26px] w-px bg-slate-300 dark:bg-white/10 z-0"></div>
<div class="absolute left-[27px] top-[26px] w-[18px] h-px bg-slate-300 dark:bg-white/10 z-0"></div>
<div class="flex items-center gap-3 flex-1 overflow-hidden pl-10 z-10">
<div class="flex items-center justify-center rounded-lg bg-primary text-black shrink-0 size-8 shadow-lg shadow-primary/20">
<span class="material-symbols-outlined text-[18px]">restaurant</span>
</div>
<div class="flex flex-col">
<p class="text-base font-medium truncate text-primary">Food</p>
<p class="text-xs text-slate-500 dark:text-primary/60">8 words</p>
</div>
</div>
<div class="shrink-0 pl-2 z-10">
<!-- Selected State -->
<div class="size-6 rounded-full bg-primary flex items-center justify-center shadow-lg shadow-primary/30">
<span class="material-symbols-outlined text-black text-[16px] font-bold">check</span>
</div>
</div>
</div>
<!-- Subgroup Item: Transportation -->
<div class="relative flex items-center justify-between p-3 rounded-lg hover:bg-black/5 dark:hover:bg-white/5 transition-colors cursor-pointer">
<!-- Indentation Guide Line -->
<div class="absolute left-[27px] top-[-24px] bottom-[50%] w-px bg-slate-300 dark:bg-white/10 z-0"></div>
<div class="absolute left-[27px] top-[50%] w-[18px] h-px bg-slate-300 dark:bg-white/10 z-0"></div>
<div class="flex items-center gap-3 flex-1 overflow-hidden pl-10 z-10">
<div class="flex items-center justify-center rounded-lg bg-slate-200 dark:bg-surface-dark text-slate-500 dark:text-slate-400 shrink-0 size-8">
<span class="material-symbols-outlined text-[18px]">directions_bus</span>
</div>
<div class="flex flex-col">
<p class="text-base font-medium truncate">Transportation</p>
<p class="text-xs text-slate-500 dark:text-slate-400">4 words</p>
</div>
</div>
<div class="shrink-0 pl-2 z-10">
<div class="size-6 rounded-full border-2 border-slate-300 dark:border-slate-600"></div>
</div>
</div>
<!-- Group Item: Common Phrases -->
<div class="group flex items-center justify-between p-3 rounded-lg hover:bg-black/5 dark:hover:bg-white/5 transition-colors cursor-pointer mt-2">
<div class="flex items-center gap-3 flex-1 overflow-hidden">
<!-- Invisible spacer for alignment with expand icon -->
<div class="w-5"></div>
<div class="flex items-center justify-center rounded-lg bg-purple-100 dark:bg-surface-dark text-purple-600 dark:text-purple-400 shrink-0 size-10">
<span class="material-symbols-outlined text-[22px]">forum</span>
</div>
<div class="flex flex-col">
<p class="text-base font-medium truncate">Common Phrases</p>
<p class="text-xs text-slate-500 dark:text-slate-400">102 words</p>
</div>
</div>
<div class="shrink-0 pl-2">
<div class="size-6 rounded-full border-2 border-slate-300 dark:border-slate-600"></div>
</div>
</div>
<!-- Group Item: Work -->
<div class="group flex items-center justify-between p-3 rounded-lg hover:bg-black/5 dark:hover:bg-white/5 transition-colors cursor-pointer">
<div class="flex items-center gap-3 flex-1 overflow-hidden">
<button class="text-slate-400 hover:text-primary dark:text-slate-500 dark:hover:text-white transition-colors">
<span class="material-symbols-outlined text-[20px] rotate-[-90deg]">expand_more</span>
</button>
<div class="flex items-center justify-center rounded-lg bg-blue-100 dark:bg-surface-dark text-blue-600 dark:text-blue-400 shrink-0 size-10">
<span class="material-symbols-outlined text-[22px]">work</span>
</div>
<div class="flex flex-col">
<p class="text-base font-medium truncate">Work</p>
<p class="text-xs text-slate-500 dark:text-slate-400">15 words</p>
</div>
</div>
<div class="shrink-0 pl-2">
<div class="size-6 rounded-full border-2 border-slate-300 dark:border-slate-600"></div>
</div>
</div>
</div>
<!-- Footer / Action Bar -->
<div class="shrink-0 bg-background-light dark:bg-background-dark border-t border-slate-200 dark:border-white/5 p-4 pb-8 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.1)] dark:shadow-none z-20">
<div class="flex items-center gap-4">
<button id="new-group-btn" class="flex items-center justify-center gap-2 h-14 px-6 rounded-xl border border-slate-200 dark:border-white/10 bg-white dark:bg-surface-dark hover:bg-slate-50 dark:hover:bg-white/5 text-slate-900 dark:text-white font-medium transition-all active:scale-95 flex-1">
<span class="material-symbols-outlined text-[20px] text-primary">create_new_folder</span>
                    New Group
                </button>
<button id="select-group-btn" class="flex items-center justify-center gap-2 h-14 px-8 rounded-xl bg-primary hover:bg-primary/90 text-background-dark font-bold text-lg shadow-lg shadow-primary/20 transition-all active:scale-95 flex-[2]">
                    Select
                </button>
</div>
</div>
</div>
<script src="js/main.js"></script>
</body></html>
