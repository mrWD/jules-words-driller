<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Word Suggestion UI</title>
<!-- Google Fonts: Lexend -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS with Config -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#13ec6a",
                        "background-light": "#f6f8f7",
                        "background-dark": "#102217",
                        "surface-dark": "#1a3525", // Slightly lighter for cards
                    },
                    fontFamily: {
                        "display": ["Lexend", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "2xl": "1rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Lexend', sans-serif;
        }
        /* Custom scrollbar hide for cleaner mobile look */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-white antialiased h-screen flex flex-col overflow-hidden">
<!-- Header -->
<header class="flex-none flex items-center justify-between px-4 py-3 bg-background-light dark:bg-background-dark z-10">
<button class="flex items-center justify-center w-10 h-10 rounded-full hover:bg-black/5 dark:hover:bg-white/10 transition-colors">
<span class="material-symbols-outlined text-2xl">chevron_left</span>
</button>
<h1 class="text-base font-bold tracking-wide uppercase text-slate-500 dark:text-slate-400">New Suggestion</h1>
<div class="flex items-center gap-1">
<span class="material-symbols-outlined text-primary text-xl" style="font-variation-settings: 'FILL' 1;">local_fire_department</span>
<span class="text-sm font-bold text-primary">12</span>
</div>
</header>
<!-- Main Scrollable Content -->
<main class="flex-1 overflow-y-auto no-scrollbar pb-32">
<div class="px-6 pt-6 pb-4 flex flex-col gap-6">
<!-- Learning Card Area -->
<div class="flex flex-col items-center text-center space-y-4 py-4">
<!-- Foreign Sentence -->
<h2 class="text-3xl md:text-4xl font-bold leading-tight">
                    El gato está <span class="text-primary border-b-4 border-primary/40 px-1 inline-block min-w-[120px]">______</span> en la cama.
                </h2>
<!-- Hints -->
<div class="space-y-1">
<p class="text-xl font-semibold text-slate-700 dark:text-slate-200">
                        Target: <span class="text-primary">Sleeping</span>
</p>
<p class="text-base font-normal text-slate-500 dark:text-slate-400">
                        The cat is sleeping on the bed.
                    </p>
</div>
</div>
<!-- Interaction Zone -->
<div class="w-full max-w-md mx-auto space-y-3">
<div class="relative group">
<input class="w-full h-14 pl-4 pr-12 rounded-xl border-2 border-slate-200 dark:border-surface-dark bg-white dark:bg-surface-dark text-lg focus:ring-0 focus:border-primary dark:focus:border-primary transition-all placeholder:text-slate-400 dark:placeholder:text-slate-500 shadow-sm" placeholder="Type the missing word..." type="text"/>
<div class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none">
<span class="material-symbols-outlined">edit</span>
</div>
</div>
<button class="w-full h-14 rounded-xl bg-slate-200 dark:bg-surface-dark text-slate-900 dark:text-white font-bold text-lg hover:bg-primary hover:text-background-dark dark:hover:bg-primary dark:hover:text-background-dark transition-all flex items-center justify-center gap-2 group">
<span>Check Answer</span>
<span class="material-symbols-outlined group-hover:translate-x-1 transition-transform">check</span>
</button>
</div>
<!-- Divider -->
<div class="w-full h-px bg-slate-200 dark:bg-white/10 my-2"></div>
<!-- Collapsible / Expansion Section -->
<div class="w-full max-w-md mx-auto">
<div class="flex items-center justify-between mb-4">
<h3 class="text-sm font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider">Other Languages</h3>
<button class="text-primary text-sm font-medium hover:underline">Collapse</button>
</div>
<div class="space-y-3">
<!-- Language Row 1 (French) -->
<div class="bg-white dark:bg-surface-dark p-3 rounded-xl border border-slate-200 dark:border-white/5 flex flex-col gap-3">
<div class="flex items-center justify-between">
<div class="flex items-center gap-2">
<div class="w-6 h-6 rounded-full bg-blue-600 flex items-center justify-center text-[10px] text-white font-bold overflow-hidden relative">
<div class="absolute inset-0 flex">
<div class="bg-blue-600 flex-1"></div>
<div class="bg-white flex-1"></div>
<div class="bg-red-600 flex-1"></div>
</div>
<!-- Simple CSS Flag representation for French -->
</div>
<span class="font-medium">French</span>
</div>
<span class="text-xs text-slate-400 dark:text-slate-500">Optional</span>
</div>
<div class="flex gap-2">
<input class="flex-1 h-10 rounded-lg bg-slate-50 dark:bg-black/20 border-transparent focus:border-primary focus:ring-0 text-sm px-3" placeholder="Word in French" type="text"/>
<button class="h-10 w-10 rounded-lg bg-primary/20 text-primary flex items-center justify-center hover:bg-primary hover:text-background-dark transition-colors">
<span class="material-symbols-outlined text-xl">add</span>
</button>
</div>
</div>
<!-- Language Row 2 (German) -->
<div class="bg-white dark:bg-surface-dark p-3 rounded-xl border border-slate-200 dark:border-white/5 flex flex-col gap-3">
<div class="flex items-center justify-between">
<div class="flex items-center gap-2">
<div class="w-6 h-6 rounded-full bg-black flex items-center justify-center text-[10px] text-white font-bold overflow-hidden relative border border-white/10">
<div class="absolute inset-0 flex flex-col">
<div class="bg-black flex-1"></div>
<div class="bg-red-600 flex-1"></div>
<div class="bg-yellow-400 flex-1"></div>
</div>
<!-- Simple CSS Flag representation for German -->
</div>
<span class="font-medium">German</span>
</div>
<span class="text-xs text-slate-400 dark:text-slate-500">Optional</span>
</div>
<div class="flex gap-2">
<input class="flex-1 h-10 rounded-lg bg-slate-50 dark:bg-black/20 border-transparent focus:border-primary focus:ring-0 text-sm px-3" placeholder="Word in German" type="text"/>
<button class="h-10 w-10 rounded-lg bg-primary/20 text-primary flex items-center justify-center hover:bg-primary hover:text-background-dark transition-colors">
<span class="material-symbols-outlined text-xl">add</span>
</button>
</div>
</div>
<!-- Add new Language -->
<button class="w-full py-3 rounded-xl border border-dashed border-slate-300 dark:border-white/20 text-slate-500 dark:text-slate-400 hover:border-primary hover:text-primary transition-colors flex items-center justify-center gap-2 text-sm font-medium">
<span class="material-symbols-outlined text-lg">add_circle</span>
                        Add another language
                    </button>
</div>
</div>
<!-- Bottom spacing to account for fixed footer -->
<div class="h-8"></div>
</div>
</main>
<!-- Footer Action Bar -->
<footer class="flex-none fixed bottom-0 left-0 w-full bg-background-light/95 dark:bg-background-dark/95 backdrop-blur-md border-t border-slate-200 dark:border-white/5 p-4 z-50 safe-area-bottom">
<div class="flex items-center justify-between gap-4 max-w-lg mx-auto">
<!-- Previous Button -->
<button class="flex flex-col items-center justify-center w-16 gap-1 text-slate-500 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white transition-colors">
<div class="w-10 h-10 rounded-full border border-slate-300 dark:border-white/10 flex items-center justify-center bg-transparent">
<span class="material-symbols-outlined text-xl">undo</span>
</div>
<span class="text-[10px] font-medium uppercase tracking-wide">Undo</span>
</button>
<!-- Action Group -->
<div class="flex items-center gap-3 flex-1 justify-end">
<button class="h-12 px-6 rounded-full text-slate-600 dark:text-slate-300 font-semibold hover:bg-slate-200 dark:hover:bg-white/5 transition-colors">
                    Skip
                </button>
<button class="h-12 px-8 bg-primary rounded-full text-background-dark font-bold text-lg shadow-[0_0_15px_rgba(19,236,106,0.4)] hover:shadow-[0_0_25px_rgba(19,236,106,0.6)] hover:scale-105 active:scale-95 transition-all flex items-center gap-2">
<span class="material-symbols-outlined">save</span>
<span>Save Word</span>
</button>
</div>
</div>
</footer>
<!-- Background Gradient Effect for ambience -->
<div class="fixed top-0 left-0 w-full h-full pointer-events-none z-[-1] overflow-hidden">
<div class="absolute top-[-10%] right-[-10%] w-[50%] h-[50%] bg-primary/5 rounded-full blur-[120px]"></div>
<div class="absolute bottom-[-10%] left-[-10%] w-[50%] h-[50%] bg-blue-500/5 rounded-full blur-[120px]"></div>
</div>
<script src="js/main.js"></script>
</body></html>
