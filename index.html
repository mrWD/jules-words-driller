<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Sign In</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700;800&amp;family=Noto+Sans:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#13ec6a",
                        "primary-hover": "#0fd65e",
                        "background-light": "#f6f8f7",
                        "background-dark": "#102217",
                        "surface-dark": "#193324",
                        "surface-light": "#ffffff",
                        "border-dark": "#326747",
                        "border-light": "#e2e8f0",
                        "text-secondary-dark": "#92c9a8",
                        "text-secondary-light": "#64748b",
                    },
                    fontFamily: {
                        "display": ["Lexend", "sans-serif"],
                        "body": ["Noto Sans", "sans-serif"],
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "2xl": "1rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        /* Custom scrollbar hide for cleaner mobile look */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-white transition-colors duration-200">
<div class="relative flex h-full min-h-screen w-full flex-col max-w-md mx-auto overflow-x-hidden shadow-2xl">
<!-- Status Bar Spacer (simulated for iOS) -->
<div class="h-10 w-full shrink-0"></div>
<!-- Top Navigation -->
<div class="flex items-center px-4 py-2 justify-between shrink-0">
<button class="flex size-10 shrink-0 items-center justify-center rounded-full hover:bg-black/5 dark:hover:bg-white/10 transition-colors">
<span class="material-symbols-outlined text-slate-900 dark:text-white" style="font-size: 24px;">arrow_back_ios_new</span>
</button>
<div class="w-10"></div> <!-- Spacer for balance -->
</div>
<!-- Scrollable Content Area -->
<div class="flex-1 flex flex-col px-6 pt-4 pb-8 overflow-y-auto no-scrollbar">
<!-- Headline Section -->
<div class="flex flex-col items-center mb-8">
<!-- Optional: App Logo Placeholder -->
<div class="size-16 bg-gradient-to-br from-primary/20 to-primary/5 rounded-2xl flex items-center justify-center mb-6 ring-1 ring-primary/30">
<span class="material-symbols-outlined text-primary" style="font-size: 32px;">school</span>
</div>
<h1 class="text-3xl font-extrabold tracking-tight text-center text-slate-900 dark:text-white mb-2">Welcome Back</h1>
<p class="text-text-secondary-light dark:text-text-secondary-dark text-center text-base font-normal">Log in to continue your learning journey</p>
</div>
<!-- Form Section -->
<div class="w-full space-y-5">
<!-- Email Field -->
<div class="space-y-2">
<label class="text-sm font-medium text-slate-700 dark:text-white ml-1" for="email">Email Address</label>
<div class="relative group">
<div class="absolute left-4 top-1/2 -translate-y-1/2 text-text-secondary-light dark:text-text-secondary-dark group-focus-within:text-primary transition-colors">
<span class="material-symbols-outlined" style="font-size: 20px;">mail</span>
</div>
<input class="w-full h-14 pl-12 pr-4 bg-surface-light dark:bg-surface-dark border border-border-light dark:border-border-dark rounded-xl text-base text-slate-900 dark:text-white placeholder:text-slate-400 dark:placeholder:text-text-secondary-dark/50 focus:outline-none focus:ring-2 focus:ring-primary/50 focus:border-primary transition-all shadow-sm" id="email" placeholder="hello@example.com" type="email" value=""/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-2">
<label class="text-sm font-medium text-slate-700 dark:text-white ml-1" for="password">Password</label>
<div class="relative group">
<div class="absolute left-4 top-1/2 -translate-y-1/2 text-text-secondary-light dark:text-text-secondary-dark group-focus-within:text-primary transition-colors">
<span class="material-symbols-outlined" style="font-size: 20px;">lock</span>
</div>
<input class="w-full h-14 pl-12 pr-12 bg-surface-light dark:bg-surface-dark border border-border-light dark:border-border-dark rounded-xl text-base text-slate-900 dark:text-white placeholder:text-slate-400 dark:placeholder:text-text-secondary-dark/50 focus:outline-none focus:ring-2 focus:ring-primary/50 focus:border-primary transition-all shadow-sm" id="password" placeholder="Enter your password" type="password" value=""/>
<button class="absolute right-0 top-0 h-full w-12 flex items-center justify-center text-text-secondary-light dark:text-text-secondary-dark hover:text-slate-900 dark:hover:text-white transition-colors cursor-pointer">
<span class="material-symbols-outlined" style="font-size: 20px;">visibility_off</span>
</button>
</div>
<!-- Forgot Password Link -->
<div class="flex justify-end pt-1">
<a class="text-sm font-medium text-slate-500 dark:text-text-secondary-dark hover:text-primary dark:hover:text-primary transition-colors" href="#">
                            Forgot Password?
                        </a>
</div>
</div>
<!-- Sign In Button -->
<button id="signin-btn" class="w-full h-14 mt-4 bg-primary hover:bg-primary-hover text-background-dark font-bold text-lg rounded-xl shadow-lg shadow-primary/20 active:scale-[0.98] transition-all flex items-center justify-center gap-2">
<span>Sign In</span>
<span class="material-symbols-outlined text-lg font-bold">arrow_forward</span>
</button>
</div>
<!-- Divider -->
<div class="relative py-8 flex items-center">
<div class="flex-grow border-t border-border-light dark:border-border-dark"></div>
<span class="flex-shrink-0 mx-4 text-sm text-slate-400 dark:text-gray-500">Or continue with</span>
<div class="flex-grow border-t border-border-light dark:border-border-dark"></div>
</div>
<!-- Social Login -->
<div class="grid grid-cols-2 gap-4">
<!-- Apple -->
<button class="flex items-center justify-center gap-3 h-14 rounded-xl bg-surface-light dark:bg-surface-dark border border-border-light dark:border-border-dark hover:bg-gray-50 dark:hover:bg-[#1f3d2c] transition-colors active:scale-[0.98]">
<svg class="h-6 w-6 text-slate-900 dark:text-white" fill="currentColor" viewbox="0 0 24 24">
<path d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.74 1.18 0 2.21-1.11 3.28-1.08 1.13.03 2.11.45 2.76 1.18-2.6 1.4-2.14 5.37.5 6.42-.56 1.74-1.37 3.42-2.22 4.41zM13 5c-2.3 0-3.14-3.05-1.04-5 2.06 0 3.32 2.87 1.04 5z"></path>
</svg>
<span class="font-medium text-slate-700 dark:text-white">Apple</span>
</button>
<!-- Google -->
<button class="flex items-center justify-center gap-3 h-14 rounded-xl bg-surface-light dark:bg-surface-dark border border-border-light dark:border-border-dark hover:bg-gray-50 dark:hover:bg-[#1f3d2c] transition-colors active:scale-[0.98]">
<svg class="h-6 w-6" viewbox="0 0 24 24">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
<span class="font-medium text-slate-700 dark:text-white">Google</span>
</button>
</div>
<!-- Spacer for bottom area -->
<div class="flex-1 min-h-[40px]"></div>
<!-- Footer -->
<div class="mt-auto py-6 text-center">
<p class="text-slate-500 dark:text-gray-400">
                    New here?
                    <a class="font-bold text-primary hover:underline hover:text-primary-hover transition-colors ml-1" href="signup.html">Create an Account</a>
</p>
</div>
</div>
<!-- Safe Area Spacer (simulated for iOS) -->
<div class="h-6 w-full shrink-0"></div>
</div>
<script src="js/main.js"></script>
</body></html>
